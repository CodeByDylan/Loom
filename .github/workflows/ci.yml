name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the version from tags, so it needs full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore

      # This is the block required before claiming `done`.
      - run: dotnet format --verify-no-changes
      - run: dotnet build  --no-restore
      - run: dotnet test   --no-build
