name: Release

# Publishing is a human action, and the tag is where that happens: nothing here runs without a tag
# someone pushed. Nothing after the tag waits for anyone, so pushing one publishes. Deployment
# protection rules would add a second pause but are unavailable on this repository's plan, so the
# environment below is not one — do not read it as an approval step.
#
# There is no publishing credential in this repository. nuget.org trusts this workflow by name, and
# issues a key that lasts an hour, so the thing an attacker would want to steal does not exist between
# releases. The trust policy on nuget.org names this file — renaming it stops publishing working.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dryRun:
        description: Pack and check, but publish nothing.
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest

    # Scopes the trust policy rather than gating the run: naming it on the policy too means nuget.org
    # refuses a key to any run that did not declare this environment. It holds nothing back by itself.
    # Required reviewers would, and this is where they belong if the plan ever allows them.
    environment: nuget

    permissions:
      contents: read
      # Lets this job ask GitHub for the signed token nuget.org exchanges for a key. Nothing else
      # here needs a permission, and nothing writes to the repository.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the version from tags, so it needs the whole history and the tags with it.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: scripts/check-docs.sh

      - run: dotnet restore

      # A release is verified the same way anything else is. Publishing something that was never
      # tested would make the tag the only evidence it worked.
      - run: dotnet format --verify-no-changes
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

      # PinTemplatesToPackageVersion rewrites the Loom version a scaffolded solution references to the
      # version being released. Only here: an untagged build's packages are never published, so a
      # template pinned to one could not restore, and CI scaffolds and builds one on every push.
      - name: Pack
        run: dotnet pack --no-build --configuration Release --output artifacts -p:PinTemplatesToPackageVersion=true

      # MinVer is configured, not magic: a wrong tag prefix or a shallow clone yields
      # 0.0.0-alpha.0.N instead of the tagged version, and pushing that would burn the version
      # number for good. So the produced packages are compared against the tag before anything
      # leaves the runner.
      - name: Check the packages carry the tagged version
        if: github.ref_type == 'tag'
        run: scripts/check-release-version.sh "${GITHUB_REF_NAME}" artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

      # Deliberately not gated on the tag: a dry run should fail here if the trust policy has stopped
      # matching, since that is otherwise discoverable only during a real release, at the worst moment.
      # The key it mints is unused in that case and expires within the hour.
      #
      # Requested this late on purpose. The key lasts an hour and one token buys exactly one key, so
      # asking before the tests and the version check would spend it on a release that may not happen.
      - name: Sign in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # A nuget.org profile name, not an email address, and not a credential — the trust policy is
          # what authorises this. Held as a secret only to keep the account name out of logs.
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        if: github.ref_type == 'tag' && inputs.dryRun != true
        env:
          # Through the environment rather than the command line, so it cannot be read from a rendered
          # command in the log.
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        # Symbol packages are pushed alongside their own package, so only the packages are named
        # here. Skipping duplicates makes re-running a partly failed release safe.
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
